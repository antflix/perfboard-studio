name: release

# Tag-driven, and the tag is checked against the version in the source rather than
# trusted. A `v0.4.0` tag on a tree that still says 0.4.0.dev0 would otherwise publish an
# installer that disagrees with its own file properties, and nothing downstream would
# notice. docs/RELEASING.md is the other half of this.
#
# A dispatch is the dry run, and NOTHING it does publishes: every step that does is
# gated on a tag ref as well as on `dry_run`. Given `version`, it also makes the checks
# the tag will make -- the source says that version, it is not a .dev build, the
# changelog has its section -- so the commit about to be tagged is rehearsed whole.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the macOS disk image but do not publish a release"
        type: boolean
        default: true
      version:
        description: "The version about to be tagged, e.g. 0.22.0: checked against the source as the tag will be"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  macos:
    name: macOS disk image
    runs-on: macos-15
    # Apple silicon, and only Apple silicon. Every x86-64 macOS label GitHub offers is a
    # *larger runner* -- `macos-15-intel`, `macos-15-large` -- which is a paid tier, and
    # the free Intel image was retired. An Intel Mac installs from source.
    #
    # Pin the SDK and operating system used to build the disk image.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Check the tag against the source
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          WANT: ${{ inputs.version }}  # a dry run's; through env, never pasted into a script
        run: |
          source_version=$(python -c "import sys; sys.path.insert(0,'src'); from perfboard_studio.version import __version__; print(__version__)")
          tag_version="${WANT:-${GITHUB_REF_NAME#v}}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::v$tag_version does not match perfboard_studio.version.__version__ ($source_version)"
            exit 1
          fi

          case "$source_version" in
            *.dev*)
              echo "::error::$source_version is a development version"
              exit 1 ;;
          esac
          grep -q "^## \[$source_version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $source_version"; exit 1; }

      - name: Build the bundle
        run: python -m PyInstaller perfboard-studio.spec --noconfirm

      # A .app is a folder, so "did it build" is not the question -- "does the binary
      # inside it run" is. Unlike Windows, a windowed macOS build still has stdio when it
      # is started from a shell, so it can simply be asked.
      - name: Check the bundle
        run: |
          test -d ./dist/PerfboardStudio.app
          test -f ./dist/PerfboardStudio.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            ./dist/PerfboardStudio.app/Contents/Info.plist
          ./dist/PerfboardStudio.app/Contents/MacOS/perfboard-studio --version
          bash packaging/check-bundle-models.sh ./dist/PerfboardStudio.app
          # The bundle's VTK, imported and asked for one offscreen frame. The spec packs
          # only the VTK modules the 3D view imports, and the window no longer imports
          # that view at start, so nothing else this job runs would notice a module the
          # spec failed to pack. Windows and Linux run `--headless`, which does.
          ./dist/PerfboardStudio.app/Contents/MacOS/perfboard-studio --probe-offscreen-gl
          # The placer's two worker processes started from inside the .app, as Place on
          # the Board will start them. A spawn pool in a frozen
          # macOS bundle is where this could break unseen, and a pool that would not
          # start prints a different line, so the grep fails here instead.
          PERFBOARD_STUDIO_PLANNER_WORKERS=2 \
            ./dist/PerfboardStudio.app/Contents/MacOS/perfboard-studio --headless examples/ne555-astable.perf \
            | tee headless.log
          grep -q "nothing committed, 2 worker processes" headless.log
          python packaging/check-mcp-stdio.py ./dist/PerfboardStudio.app/Contents/MacOS/perfboard-studio --mcp

      - name: Build the disk image
        run: bash packaging/macos.sh

      # Mounted and run out of the mounted volume, which is the last state anything is in
      # before a user sees it.
      - name: Mount it and run what is inside
        run: |
          image=$(ls releases/*.dmg)
          hdiutil attach "$image" -mountpoint /Volumes/PerfboardStudio -nobrowse -quiet

          # The signature of the *copy*, which is the only place it can have been lost.
          # `packaging/macos.sh` verifies the bundle it was handed; this verifies the one
          # that came out the other end of `ditto` and `hdiutil`. Running the binary
          # would not catch it -- on arm64 the kernel checks the signature embedded in
          # the Mach-O, and the signatures a copy actually drops are the ones stored in
          # extended attributes for everything that is not one.
          codesign --verify --verbose=1 /Volumes/PerfboardStudio/PerfboardStudio.app

          app=/Volumes/PerfboardStudio/PerfboardStudio.app/Contents/MacOS/perfboard-studio
          reported=$("$app" --version | head -1)
          echo "$reported"
          version=$(python -c "import sys; sys.path.insert(0,'src'); from perfboard_studio.version import __version__; print(__version__)")
          case "$reported" in
            "Perfboard Studio $version"*) ;;
            *) echo "::error::bundle reports '$reported', expected Perfboard Studio $version"; exit 1 ;;
          esac
          test -L /Volumes/PerfboardStudio/Applications

          # Retried, because the failure is not ours and is not deterministic. macOS
          # attaches a `diskimages-helper` to a freshly mounted volume and Spotlight
          # indexes it; either can still hold the mount when the step is done with it, and
          # `hdiutil detach` answers 16, "resource busy". Observed once here on a run whose
          # signature check, version check and symlink check had all just passed -- which
          # on a tag would have thrown away the built disk image over a volume that had
          # nothing to do with them. Force on the last attempt: by then the only thing
          # holding it is a helper that has outlived what it was helping.
          for attempt in 1 2 3; do
            hdiutil detach /Volumes/PerfboardStudio -quiet && exit 0
            echo "detach attempt $attempt failed; the volume is still busy"
            sleep 10
          done
          hdiutil detach /Volumes/PerfboardStudio -force

      - name: Build the checksum
        working-directory: releases
        run: shasum -a 256 -- *.dmg > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: perfboard-studio-macos-dmg
          path: |
            releases/*.dmg
            releases/SHA256SUMS
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib, re, sys
          sys.path.insert(0, "src")
          from perfboard_studio.version import __version__
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.split(rf"^## \[{re.escape(__version__)}\].*$",
                             text, maxsplit=1, flags=re.MULTILINE)[1]
          notes = re.split(r"^## ", section, maxsplit=1, flags=re.MULTILINE)[0].strip()
          pathlib.Path("notes.md").write_text(notes + chr(10), encoding="utf-8")
          PY
          cat >> notes.md <<'EOF'

          ---
          **macOS** - `perfboard-studio-...-arm64.dmg`, Apple silicon. Drag it to Applications,
          then run this **before opening it**:

          ```
          xattr -dr com.apple.quarantine /Applications/PerfboardStudio.app
          ```

          It is signed ad-hoc but not notarized, so Gatekeeper blocks the first launch.
          On macOS 15 and later the dialog it raises defaults to **Move to Trash**, which
          deletes the install. Clearing the flag first avoids the dialog entirely. On an
          Intel Mac, install from source.

          **Checking your download** - use `shasum -a 256 -c SHA256SUMS` on macOS.
          Perfboard Studio also verifies the checksum when it downloads an update.

          This is pre-alpha software. Nobody has yet built a real board by following a
          generated guide - check every measurement against the part in your hand.
          EOF
          gh release create "$GITHUB_REF_NAME" releases/*.dmg releases/SHA256SUMS \
            --title "Perfboard Studio $GITHUB_REF_NAME" --notes-file notes.md
